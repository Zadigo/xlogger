services:
  xlogger:
    build: ./goxlogger
    container_name: xlogger-app
    environment:
      - XLOGGER_PORT=9000
      - REDIS_ADDR=redis:6379
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "9000:9000"
    volumes:
      - ./config.yaml:/app/config.yaml
    networks:
      - xlogger

  redis:
    image: redis:latest
    container_name: xlogger-redis
    healthcheck:  
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    ports:
      - "6379:6379"
    networks:
      - xlogger

  db:
    build: ./docker/db
    container_name: xlogger-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=/run/secrets/postgres-secret
      - POSTGRES_DB=xlogger
    ports:
      - "5432:5432"
    networks:
      - xlogger

networks:
  xlogger:
    driver: bridge

secrets:
  postgres-secret:
    file: ./docker/secrets/postgres_secret.txt
